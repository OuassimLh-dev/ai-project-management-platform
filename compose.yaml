name: ai-project-management
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:-local-docker-password-only}
      POSTGRES_DB: ai_project_management
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_user -d ai_project_management"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://project_user:${COMPOSE_DB_PASSWORD:-local-docker-password-only}@db:5432/ai_project_management
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-only-not-a-production-secret-123456789}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}'
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
